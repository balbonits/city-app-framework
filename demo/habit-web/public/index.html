<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habit Streaks</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <p class="brand">Habit Streaks</p>
    <nav aria-label="Main">
      <a href="/" aria-current="page">Today</a>
      <a href="/about.html">About</a>
    </nav>
  </header>
  <main id="main">
    <h1>Today</h1>
    <form id="add-form" class="add">
      <label for="habit-name">New habit</label>
      <div class="row">
        <input id="habit-name" name="name" required maxlength="60" autocomplete="off" placeholder="Read 10 pages">
        <button type="submit">Add habit</button>
      </div>
    </form>
    <p id="empty" class="empty">No habits yet. Add one above.</p>
    <ul id="habits" class="habits"></ul>
  </main>
</body>
</html>
